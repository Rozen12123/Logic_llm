# 运行用户，非 root 运行通常注释掉或设为 nobody，但在前台运行不用管
# user nobody;
worker_processes 1;

# 【核心】把 PID 和 错误日志 指定到你的新 Nginx 文件夹下
pid        /home/shixuanliu/yj_main/logic_lmm/Logic_llm/Nginx/nginx.pid;
error_log  /home/shixuanliu/yj_main/logic_lmm/Logic_llm/Nginx/logs/error.log;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 【核心】把访问日志指定到你的新 Nginx 文件夹下
    access_log /home/shixuanliu/yj_main/logic_lmm/Logic_llm/Nginx/logs/access.log;

    # 【核心】把所有临时路径指定到你的新 Nginx/temp 文件夹下
    # 否则非 root 用户会因为没有 /var/lib/nginx 的权限而报错
    client_body_temp_path /home/shixuanliu/yj_main/logic_lmm/Logic_llm/Nginx/temp/client_body;
    proxy_temp_path       /home/shixuanliu/yj_main/logic_lmm/Logic_llm/Nginx/temp/proxy;
    fastcgi_temp_path     /home/shixuanliu/yj_main/logic_lmm/Logic_llm/Nginx/temp/fastcgi;
    uwsgi_temp_path       /home/shixuanliu/yj_main/logic_lmm/Logic_llm/Nginx/temp/uwsgi;
    scgi_temp_path        /home/shixuanliu/yj_main/logic_lmm/Logic_llm/Nginx/temp/scgi;

    sendfile        on;
    keepalive_timeout  65;

    # 定义 vLLM 后端集群 (8个实例)
    # 假设后端依然跑在 9000-9007 端口
    upstream vllm_backend {
        least_conn;
        server 127.0.0.1:9000;
        server 127.0.0.1:9001;
        server 127.0.0.1:9002;
        server 127.0.0.1:9003;
        server 127.0.0.1:9004;
        server 127.0.0.1:9005;
        server 127.0.0.1:9006;
        server 127.0.0.1:9007;
    }

    server {
        listen 8668;       # 对外暴露的端口
        server_name localhost;

        location / {
            proxy_pass http://vllm_backend;

            # --- 关键配置：透传 API Key 和 IP ---
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization; 

            # --- 关键配置：支持流式输出 (SSE) ---
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;

            # --- 关键配置：防止长文生成超时 (10分钟) ---
            proxy_read_timeout 600s;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}